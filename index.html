<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHBAKERGAME - Production Game + Editor</title>
  <style>
    body{font-family:system-ui,Arial;background:#0f0f10;color:#fff;text-align:center;padding:64px}
    a{display:inline-block;margin:12px;padding:14px 18px;border:1px solid #2a2a2a;border-radius:12px;color:#8ff;text-decoration:none}
    a:hover{border-color:#8ff}
    .wrap{max-width:720px;margin:0 auto}
    h1{font-size:40px;margin:0 0 10px}
    p{opacity:.85}
    .subtitle{font-size:14px;color:#9fb0c5;margin-bottom:32px}
    .note{margin-top:32px;font-size:12px;color:#666}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧁 PHBAKERGAME</h1>
    <p class="subtitle">Production-Ready Tower Defense Game + Editor Dashboard</p>
    <p>Select an application:</p>
    <p>
      <a href="./apps/game/dist/" target="_blank">🎮 Play Game</a>
      <a href="./apps/editor/dist/" target="_blank">🎨 Editor Dashboard</a>
    </p>
    <p class="note">
      <strong>Development:</strong><br>
      Run <code>npm run dev:game</code> for game (port 3000)<br>
      Run <code>npm run dev:editor</code> for editor (port 3001)
    </p>
    <p class="note">
      <strong>Production:</strong><br>
      Run <code>npm run build</code> to build both apps
    </p>
  </div>
</body>
</html>
